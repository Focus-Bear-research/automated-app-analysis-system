# ---------------------------------------------------------------------
# Apps to EXCLUDE (issue #25)
# ---------------------------------------------------------------------
# These apps are not Focus Bear competitors, so they are left out of the
# review scraping (scrapers/reviews_pipeline.py) and the competitor
# complaints analysis (etl/review_filters.py).
# Format: the app_key used in data/curated/reviews.csv (<store>:<app id>).
# To exclude another app, add its app_key below with a short comment.
# Rule (Oct 2026): keep only clear competitors (blockers, screen time, focus
# timers, ADHD, habit/routine planners). Meditation apps are excluded (Jeremy),
# and apps whose purpose was unclear are excluded to be safe.
exclude_app_keys:
  # Not competitors: parental controls, clocks, office/PDF, AI chat, phone-maker apps, and other non-focus apps
  - play:ai.x.grok.bot    # AI chatbot
  - play:aws.exam    # exam prep
  - play:com.adobe.reader    # Adobe Acrobat Reader: Edit PDF
